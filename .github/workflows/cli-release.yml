name: cli-release

# Build the nec2++ command-line executables (BUILD-CLI.md) for two engine
# variants on Linux, Windows (MSVC) and Windows (MinGW, one static file),
# smoke-test them, test the 4nec2 file-name conventions, compare the two
# Windows builds deck by deck, and upload zips.
#
#   workflow_dispatch  -> workflow ARTIFACTS only (never a release). GitHub
#                        only offers it once this file is on the default
#                        branch; until then a push to cli-build runs it:
#   push to cli-build  -> the same, artifacts only
#   push of a cli-v* tag -> the same, plus a GitHub release with the zips,
#                          but only if the tag push is the trigger AND the
#                          repository variable CLI_RELEASE_ENABLED is "true".
#                          (Publishing is the maintainer's decision: set the
#                          variable, then push the tag.)
#
# Each variant builds a FIXED necpp commit (below), with this branch's
# scripts/ applied on top.

on:
  workflow_dispatch:
  push:
    branches: [cli-build, cli-4nec2-static]
    tags: ["cli-v*"]

permissions:
  contents: read

env:
  # pynec-accel 1.7.6's necpp_src (python-necpp v1.7.6)
  NECPP_ACCEL_COMMIT: a08a0d980cf9d7e3c1b327675bf17713ab2ac241
  # fill-pair reuse (python-necpp feat/fill-pair-reuse's necpp_src)
  NECPP_REUSE_COMMIT: 62dacd44bc4d76c37e5164000d11ee1ac68c1a81
  # the scipy-openblas32 the pynec-accel 1.7.6 Windows wheels bundle
  SCIPY_OPENBLAS32: "0.3.34.0.0"

jobs:
  build:
    name: ${{ matrix.variant }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        variant: [accel, reuse]
        os: [linux, windows, windows-mingw]
    runs-on: ${{ startsWith(matrix.os, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-mingw' && 'msys2 {0}' || 'bash' }}
    steps:
      - name: Check out the build scripts (this ref)
        uses: actions/checkout@v4
        with:
          path: cli
      - name: Check out the necpp commit this variant builds
        uses: actions/checkout@v4
        with:
          path: necpp-src
          ref: ${{ matrix.variant == 'reuse' && env.NECPP_REUSE_COMMIT || env.NECPP_ACCEL_COMMIT }}

      # ---------------- Linux: gcc 14 in ubuntu:24.04, fully static ----------
      - name: Cache OpenBLAS (Linux)
        if: matrix.os == 'linux'
        uses: actions/cache@v4
        with:
          path: work/openblas-0.3.34
          key: openblas-0.3.34-ubuntu24.04-gcc14-${{ hashFiles('cli/scripts/build_cli.py') }}
      - name: Build (Linux, in ubuntu:24.04)
        if: matrix.os == 'linux'
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e HOST_UID="$(id -u)" ubuntu:24.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq gcc-14 g++-14 make patch git python3 binutils file ca-certificates >/dev/null
            git config --global --add safe.directory "*"
            CC=gcc-14 CXX=g++-14 python3 cli/scripts/build_cli.py --variant ${{ matrix.variant }} \
              --src necpp-src --out out --work work --openblas-prefix work/openblas-0.3.34 --jobs 4
            chown -R "$HOST_UID" out work'
          file out/*
          ldd out/nec2++-* || true

      # ---------------- Windows: MSVC + scipy-openblas32 ----------------------
      - name: Set up Python (Windows)
        if: matrix.os == 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MSVC developer environment (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build (Windows)
        if: matrix.os == 'windows'
        run: |
          python -m pip install "scipy-openblas32==$SCIPY_OPENBLAS32"
          python cli/scripts/build_cli.py --variant ${{ matrix.variant }} \
            --src necpp-src --out out --work work --jobs 4
          # vcomp140.dll (MSVC OpenMP runtime, redistributable) ships beside the exe.
          vcomp="$(find "$(cygpath -u "$VCToolsRedistDir")" -ipath '*x64*OpenMP*' -iname vcomp140.dll | grep -iv -e onecore -e debug | head -1)"
          test -n "$vcomp"
          cp "$vcomp" out/
          # Imports: only Windows system DLLs, or DLLs shipped beside the exe
          # (missing Microsoft runtime DLLs are copied in from the redist tree).
          python cli/scripts/check_imports.py out --redist "$VCToolsRedistDir"

      # ---------------- Windows: MSYS2 MINGW64, one static file --------------
      - name: MSYS2 MINGW64 (Windows, MinGW)
        if: matrix.os == 'windows-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-libgomp mingw-w64-x86_64-binutils
            mingw-w64-x86_64-python make patch git perl
      # The MinGW OpenBLAS build takes ~20 min, so its cache is saved as soon
      # as it exists, even when a later step fails. The key names the
      # OpenBLAS flags' revision: bump "flags1" when OPENBLAS_FLAGS in
      # build_cli.py or the MSYS2 toolchain changes.
      - name: Restore OpenBLAS (Windows, MinGW)
        if: matrix.os == 'windows-mingw'
        uses: actions/cache/restore@v4
        with:
          path: work/openblas-0.3.34
          key: openblas-0.3.34-mingw64-flags1
      - name: Build (Windows, MinGW)
        if: matrix.os == 'windows-mingw'
        run: |
          gcc --version | head -1; ld --version | head -1
          python cli/scripts/build_cli.py --toolchain mingw --variant ${{ matrix.variant }} \
            --src necpp-src --out out --work work --openblas-prefix work/openblas-0.3.34 --jobs 4
      - name: Save OpenBLAS (Windows, MinGW)
        if: always() && matrix.os == 'windows-mingw' && hashFiles('work/openblas-0.3.34/lib/libopenblas.a') != ''
        uses: actions/cache/save@v4
        with:
          path: work/openblas-0.3.34
          key: openblas-0.3.34-mingw64-flags1
        continue-on-error: true
      - name: Imports gate (Windows, MinGW) -- KERNEL32 and msvcrt only, nothing Windows 7 lacks
        if: matrix.os == 'windows-mingw'
        run: |
          objdump -p out/*.exe | grep "DLL Name"
          python cli/scripts/check_imports.py out --only kernel32.dll,msvcrt.dll --win7

      # ---------------- smoke test: both engine copies -----------------------
      - name: Smoke test (auto dispatch, baseline forced, avx2 forced)
        run: |
          py=python3; [ "${{ matrix.os }}" != linux ] && py=python
          exe="$(ls out/nec2++-* | grep -v -i '\.dll$' | head -1)"
          echo "EXE=$exe" >> "$GITHUB_ENV"; echo "PY=$py" >> "$GITHUB_ENV"
          "$exe" -v
          "$exe" -b | tail -3
          $py cli/scripts/smoke/check.py --exe "$exe" --engine auto
          $py cli/scripts/smoke/check.py --exe "$exe" --engine baseline
          $py cli/scripts/smoke/check.py --exe "$exe" --engine avx2
      - name: 4nec2 file names (argv, stdin, nec2d.tmp beside the exe)
        run: $PY cli/scripts/smoke/check_nec2d.py --exe "$EXE"
      - name: Baseline copy on an SSE-only CPU (Linux, qemu-user -cpu Westmere)
        # qemu's decoder raises #UD on any VEX (AVX/AVX2/FMA) instruction when
        # the emulated CPU lacks AVX, so this proves the auto-dispatched
        # baseline path never executes one. cpuid there also reports no
        # x86-64-v3, so the dispatcher must pick the baseline by itself.
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user >/dev/null
          cat > /tmp/qnec <<EOF
          #!/bin/sh
          exec qemu-x86_64 -cpu Westmere "$PWD/$EXE" "\$@"
          EOF
          chmod +x /tmp/qnec
          NECPP_ENGINE_VERBOSE=1 /tmp/qnec -v
          python3 cli/scripts/smoke/check.py --exe /tmp/qnec --engine auto | tee /tmp/q.log
          grep -q "engine: baseline" /tmp/q.log
          if NECPP_ENGINE=avx2 /tmp/qnec -v; then echo "avx2 forced on a CPU without it must refuse"; exit 1; fi
      - name: Compare with the matching pynec-accel wheel (Linux)
        # accel = pynec-accel 1.7.6's engine; reuse = 1.7.7's (62dacd4), whose
        # reuse is opt-in there, so PYNEC_FILL_REUSE=1 turns it on for PyNEC.
        if: matrix.os == 'linux'
        run: |
          if [ "${{ matrix.variant }}" = reuse ]; then pin=1.7.7; export PYNEC_FILL_REUSE=1; else pin=1.7.6; fi
          python3 -m venv /tmp/pynec && /tmp/pynec/bin/pip install -q "pynec-accel==$pin"
          /tmp/pynec/bin/python cli/scripts/smoke/check.py --exe "$EXE" --engine baseline --pynec
          /tmp/pynec/bin/python cli/scripts/smoke/check.py --exe "$EXE" --engine avx2 --pynec

      # ---------------- package ----------------------------------------------
      - name: Package
        id: pkg
        run: |
          base="$(basename "$EXE" .exe)"
          mkdir -p "pkg/$base"
          cp out/* "pkg/$base/"
          cp necpp-src/COPYING "pkg/$base/COPYING-necpp-GPL-2.0.txt"
          cp cli/scripts/licenses/OpenBLAS-LICENSE.txt "pkg/$base/"
          if [ "${{ matrix.os }}" = windows ]; then
            cp cli/scripts/licenses/MSVC-redist-NOTICE.txt "pkg/$base/"
          fi
          if [ "${{ matrix.os }}" = windows-mingw ]; then
            # Statically linked runtime pieces whose licences ask for their
            # notice in binary copies: winpthreads (MIT-style) and the
            # mingw-w64 CRT start-up code. libgcc / libstdc++ / libgomp are
            # under the GCC Runtime Library Exception (no notice required).
            lic=/mingw64/share/licenses
            ls "$lic" | grep -i -e pthread -e crt -e mingw || true
            f="$(find "$lic" -ipath '*pthread*' -type f | head -1)"
            test -n "$f" && cp "$f" "pkg/$base/winpthreads-LICENSE.txt"
            f="$(find "$lic" -ipath '*crt*' -type f -iname 'COPYING*' | head -1)"
            if [ -n "$f" ]; then cp "$f" "pkg/$base/mingw-w64-crt-LICENSE.txt"; fi
          fi
          if [ "${{ matrix.os }}" != linux ]; then
            cp cli/scripts/install-4nec2.cmd "pkg/$base/"
          fi
          $PY cli/scripts/make_readme.py --variant ${{ matrix.variant }} --os ${{ matrix.os }} \
            --necpp-commit "$(git -C necpp-src rev-parse HEAD)" --cli-commit "$(git -C cli rev-parse HEAD)" \
            --exe "$EXE" > "pkg/$base/README.txt"
          cd pkg
          if [ "${{ matrix.os }}" != linux ]; then 7z a -bd "$base.zip" "$base" >/dev/null; else zip -qr "$base.zip" "$base"; fi
          ls -la . "$base"
          echo "name=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: pkg/${{ steps.pkg.outputs.name }}.zip
          if-no-files-found: error

  compare-windows:
    # The MSVC and MinGW executables of each variant, side by side on one
    # runner: the same decks through both (correctness), then timing.
    name: MSVC vs MinGW / ${{ matrix.variant }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant: [accel, reuse]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli
      - name: Check out the necpp commit (its test decks)
        uses: actions/checkout@v4
        with:
          path: necpp-src
          ref: ${{ matrix.variant == 'reuse' && env.NECPP_REUSE_COMMIT || env.NECPP_ACCEL_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: "nec2++-*-windows-*"
      - name: Unpack
        run: |
          for z in dl/*/*.zip; do 7z x -bd -y -oexes "$z" >/dev/null; done
          ls -la exes/*
          # "accel-*" would also match "accel-reuse-*": name the 7-hex sha.
          if [ "${{ matrix.variant }}" = reuse ]; then p="nec2++-accel-reuse-"; else p="nec2++-accel-"; fi
          msvc="$(ls exes/${p}[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]-windows-x86_64/*.exe)"
          mingw="$(ls exes/${p}[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]-windows-mingw-x86_64/*.exe)"
          test -n "$msvc" && test -n "$mingw" && test "$(echo "$msvc" | wc -l)" = 1 && test "$(echo "$mingw" | wc -l)" = 1
          echo "MSVC=$msvc" >> "$GITHUB_ENV"; echo "MINGW=$mingw" >> "$GITHUB_ENV"
      - name: Sizes and imports
        run: |
          for e in "$MSVC" "$MINGW"; do
            echo "== $e: $(stat -c %s "$e") bytes"
            # Git Bash would rewrite /nologo into a path: MSYS_NO_PATHCONV.
            MSYS_NO_PATHCONV=1 dumpbin /nologo /dependents "$e" | sed -n '/following dependencies/,/Summary/p'
            ls -la "$(dirname "$e")"
          done
      - name: Correctness (smoke + necpp testharness decks), each engine copy
        run: |
          mkdir decks; cp cli/scripts/smoke/*.nec decks/; cp necpp-src/testharness/data/*.nec decks/
          rm decks/hang.nec  # a regression deck for a hang: never finishes, on any build
          for eng in baseline avx2; do
            python cli/scripts/smoke/compare_exes.py --a "$MSVC" --a-label MSVC --b "$MINGW" --b-label MinGW \
              --decks decks --engine $eng --timeout 300
          done
      - name: Timing (indicative; synthetic 4,333-segment whip-over-grid deck, 13 frequencies)
        run: |
          python cli/scripts/smoke/make_grid_deck.py > grid.nec
          echo "CPUs: $NUMBER_OF_PROCESSORS"
          NECPP_ENGINE_VERBOSE=1 "$MINGW" -v
          # Each build at its default thread count (one per physical core in
          # the mask) and at OMP_NUM_THREADS=4 (every vCPU), twice each.
          for label in MSVC MINGW; do
            exe="${!label}"
            for reuse in 0 1; do
              [ "${{ matrix.variant }}" = accel ] && [ $reuse = 1 ] && continue
              for thr in default 4; do
                for k in 1 2; do
                  s=$(date +%s.%N)
                  if [ $thr = default ]; then
                    PYNEC_FILL_REUSE=$reuse "$exe" -n -i grid.nec -o "grid-$label-$reuse.out"
                  else
                    OMP_NUM_THREADS=$thr PYNEC_FILL_REUSE=$reuse "$exe" -n -i grid.nec -o "grid-$label-$reuse.out"
                  fi
                  e=$(date +%s.%N)
                  echo "TIMING variant=${{ matrix.variant }} build=$label PYNEC_FILL_REUSE=$reuse threads=$thr run=$k wall=$(python -c "print(f'{$e-$s:.2f}')") s"
                done
              done
            done
          done
          python cli/scripts/smoke/compare_exes.py --a "$MSVC" --a-label MSVC --b "$MINGW" --b-label MinGW \
            --decks grid.nec --timeout 600

  release:
    # Only on a cli-v* tag push, and only when the maintainer has opted in.
    if: startsWith(github.ref, 'refs/tags/cli-v') && vars.CLI_RELEASE_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
